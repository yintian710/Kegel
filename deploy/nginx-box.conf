# 测试环境（同域名 /box 子路径）Nginx 片段
# 把下面的 location 追加到现有 server {}（HTTPS、同一域名）里即可，生产根路径配置保持不变。
#
# 说明：
#   - 测试前端静态目录：/srv/kegel/site-box（用 VITE_BASE=/box/ 构建产物）
#   - 测试后端进程：127.0.0.1:7190（见 .env.box.example）
#   - 浏览器访问：https://your-domain.example/box/

# /box 补斜杠，避免相对路径解析错乱
location = /box {
    return 301 /box/;
}

# 测试 API：/box/api/xxx -> 后端 /api/xxx（proxy_pass 末尾斜杠负责去掉 /box 前缀）
location /box/api/ {
    proxy_pass http://127.0.0.1:7190/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # Origin 由浏览器发出为 https://your-domain.example（不含路径），
    # 后端 APP_BASE_URL 也设为同一 Origin，因此无需改写 Origin 头。
}

# 测试前端静态资源 + SPA 回退
location /box/ {
    alias /srv/kegel/site-box/;
    try_files $uri $uri/ /box/index.html;
    # index.html 不缓存，hash 资源可长缓存（按需开启）
    location = /box/index.html {
        add_header Cache-Control "no-store";
    }
}
