[project]
name = "kegel"
version = "2.0.0"
description = "基于 LINUX DO OAuth 的每日站内积分打卡与 LDC 赞助站点（FastAPI + Tortoise ORM + PostgreSQL + Vue 3）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tortoise-orm[asyncpg]>=0.25",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "arrow>=1.3",
    "tzdata>=2024.1",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
